<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dissolving Notepad - Flow or Vanish</title>
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  
  <main class="app-container">
    <header class="app-header">
      <div class="brand">
        <div class="flame-icon" id="flameIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"/>
          </svg>
        </div>
        <div class="title-group">
          <h1>Dissolving Notepad</h1>
          <p class="tagline">Write continuously. Pause for 3 seconds, and your thoughts turn to ash.</p>
        </div>
      </div>

      <div class="controls-bar">
        <div class="timer-badge" id="timerBadge" title="Idle countdown">
          <span class="timer-dot"></span>
          <span class="timer-label">Time left:</span>
          <span class="timer-value" id="countdownVal">3.0s</span>
        </div>

        <div class="stats-group">
          <div class="stat-item" title="Words written">
            <span class="stat-number" id="wordCount">0</span>
            <span class="stat-label">words</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item" title="Characters written">
            <span class="stat-number" id="charCount">0</span>
            <span class="stat-label">chars</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item" title="Highest word count reached in this session">
            <span class="stat-number highlight" id="sessionPeak">0</span>
            <span class="stat-label">peak</span>
          </div>
        </div>

        <div class="action-buttons">
          <button id="copyBtn" class="btn btn-secondary" title="Copy current text to clipboard" aria-label="Copy note">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>Copy</span>
          </button>
          <button id="soundToggle" class="btn btn-icon" title="Toggle audio feedback" aria-label="Toggle sound">
            <span id="soundIcon">🔊</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Urgency indicator progress bar -->
    <div class="progress-track" aria-hidden="true">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Main writing area -->
    <section class="editor-wrapper">
      <div class="editor-canvas-container" id="editorContainer">
        <!-- Floating canvas for smoke/ember dissolution particles -->
        <canvas id="particleCanvas" class="particle-canvas"></canvas>

        <textarea 
          id="editor" 
          placeholder="Start typing without stopping... Thoughts only live while you keep writing."
          spellcheck="false"
          autofocus
        ></textarea>
        
        <!-- Dissolve overlay flash when vanishing -->
        <div class="dissolve-overlay" id="dissolveOverlay"></div>
      </div>

      <footer class="editor-footer">
        <div class="status-indicator" id="statusMessage">
          <span class="status-pulse"></span>
          <span class="status-text">Ready. Start typing whenever you're prepared.</span>
        </div>
        <div class="hint-text">
          <span>Tip: Don't edit or overthink — purely let words stream out.</span>
        </div>
      </footer>
    </section>
  </main>

  <!-- Audio elements generated via Web Audio API synth in script.js -->
  <script src="script.js"></script>
</body>
</html>
